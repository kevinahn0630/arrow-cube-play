<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon (2026-11-02): the logo's cube, a white arrow folding over its top edge,
       at dawn with a pale sun behind it. Full bleed (iOS and Android round the corners
       themselves); the cube stays inside the middle 80% so masks never cut it. The sky
       runs past the edges because Android's adaptive icon draws #back and #front as two
       layers half as big again as what shows. The PNGs next to it and Android's mipmaps
       are this, drawn onto a canvas in a browser. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="154" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcdbe"/>
      <stop offset=".55" stop-color="#fbe5dc"/>
      <stop offset="1" stop-color="#ddd9f0"/>
    </linearGradient>
    <radialGradient id="sun" cx="256" cy="226" r="196" gradientUnits="userSpaceOnUse">
      <stop offset=".6" stop-color="#fff7f0"/>
      <stop offset="1" stop-color="#fff7f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <g id="back">
    <rect x="-128" y="-128" width="768" height="768" fill="url(#sky)"/>
    <circle cx="256" cy="226" r="196" fill="url(#sun)"/>
  </g>
  <g id="front">
    <ellipse cx="256" cy="426" rx="112" ry="14" fill="#7a4a62" opacity=".35" filter="url(#soft)"/>
    <g transform="translate(256 248) scale(1.56)"><defs><clipPath id="iconClip"><path d="M-5 -97.11 A10 10 0 0 1 5 -97.11 L81.6 -52.89 A10 10 0 0 1 86.6 -44.23 L86.6 44.23 A10 10 0 0 1 81.6 52.89 L5 97.11 A10 10 0 0 1 -5 97.11 L-81.6 52.89 A10 10 0 0 1 -86.6 44.23 L-86.6 -44.23 A10 10 0 0 1 -81.6 -52.89 Z"/></clipPath></defs><g clip-path="url(#iconClip)"><path d="M0 -100 L86.6 -50 L0 0 L-86.6 -50Z" fill="#f6cdbd"/><path d="M-86.6 -50 L0 0 L0 100 L-86.6 50Z" fill="#e9a196"/><path d="M0 0 L86.6 -50 L86.6 50 L0 100Z" fill="#c27f8f"/><g fill="#fff"><path transform="matrix(.866 .5 0 1 -86.6 -50)" d="M41 0H59V84H41Z"/><path transform="matrix(.866 -.5 .866 .5 -86.6 -50)" d="M0 41H68V59H0Z"/><path transform="matrix(.866 -.5 .866 .5 -86.6 -50)" d="M92 50 62 27V73Z" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></g></g></g>
  </g>
</svg>
