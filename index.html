<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrow Cube 프로토타입</title>
<!-- Added to a phone's home screen, it opens full screen like an app. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arrow Cube">
<meta name="theme-color" content="#5b6cff">
<style>
  :root {
    --bg1: #eef1ff;
    --bg2: #dce4fa;
    --ink: #1f2a4d;
    --muted: #6b7599;
    --accent: #5b6cff;
    --card: #ffffffe0;
    --line: #d5dbf3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #scenery { position: fixed; inset: 0; pointer-events: none; }
  #scenery svg { display: block; width: 100%; height: 100%; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; }
  .pill {
    background: var(--card);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 4px 16px #2a3a8014;
  }
  .hud {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
  }
  .hud-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hud-home { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; color: var(--ink); pointer-events: auto; flex: none; }
  .hud-home svg { width: 22px; height: 22px; }
  .title { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 7px 14px 7px 9px; text-align: left; pointer-events: auto; }
  .title .flag { width: 33px; }
  .title-text { min-width: 0; }
  .title b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title small { display: block; font-size: 12px; color: var(--muted); }
  /* A world's flag (flags.js), 3:2 with soft corners. */
  .flag { display: block; flex: none; aspect-ratio: 3 / 2; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px #1f2a4d22; }
  .flag svg { display: block; width: 100%; height: 100%; }
  .count { padding: 6px 14px; font-size: 22px; font-weight: 800; color: var(--accent); }
  .hud-right { display: flex; align-items: center; gap: 8px; }
  .hearts { padding: 6px 12px; font-size: 20px; line-height: 1.35; color: #e5484d; letter-spacing: 2px; }
  .hearts i { font-style: normal; color: var(--muted); opacity: 0.4; }
  .hearts.lost { animation: shake 0.4s; }
  /* The build players get (src/build.js): no ◀ 다시 ▶, auto-solve, generator or zoom buttons. */
  .release .bar, .release #panel, .release #zoomIn, .release #zoomOut, .release #resetView { display: none !important; }
  @keyframes shake {
    20%, 60% { transform: translateX(-4px); }
    40%, 80% { transform: translateX(4px); }
  }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .zoom {
    position: fixed;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .zoom button { width: 44px; height: 44px; padding: 0; font-size: 20px; }
  .bar {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .panel {
    position: fixed;
    left: 16px;
    bottom: 76px;
    width: min(340px, calc(100% - 32px));
    max-height: calc(100% - 180px);
    overflow: auto;
    padding: 14px 16px;
  }
  .panel[hidden], .clear[hidden] { display: none; }
  .panel h3 { margin: 0 0 10px; font-size: 15px; }
  .row { margin: 8px 0; }
  .row label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .row output { color: var(--ink); font-weight: 600; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .row select { width: 100%; margin-top: 4px; font: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .seed { display: flex; gap: 8px; align-items: center; }
  .seed input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 10px 0; }
  .stats { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; white-space: pre-line; }
  #gen { width: 100%; }
  .clear {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #1f2a4d55;
  }
  .clear .card { background: #fff; border-radius: 20px; padding: 28px 32px; text-align: center; min-width: 240px; }
  .clear h2 { margin: 0 0 18px; }
  .clear-stars { margin: -8px 0 18px; font-size: 14px; color: var(--muted); }
  .clear-stars:empty { display: none; }
  .clear .clear-stars { max-width: 300px; line-height: 1.5; }
  /* The tutorial's guide box, under the cube. */
  .guide {
    position: fixed;
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(520px, calc(100% - 32px));
    padding: 10px 14px 14px 16px;
    background: #fffffff2;
    border-left: 5px solid var(--accent);
  }
  body:not(.release) .guide { bottom: 72px; }
  .guide[hidden] { display: none; }
  .guide.nudge { animation: nudge 0.4s; }
  @keyframes nudge {
    20%, 60% { transform: translateX(calc(-50% - 5px)); }
    40%, 80% { transform: translateX(calc(-50% + 5px)); }
  }
  .guide-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .guide-head b { font-size: 12px; color: var(--accent); }
  .guide-head button { padding: 4px 10px; font-size: 12px; color: var(--muted); }
  .guide p { margin: 0; font-size: 16px; line-height: 1.55; }
  .guide .primary { display: block; width: 100%; margin-top: 10px; }
  .guide .primary[hidden] { display: none; }

  /* The loading screen: the logo while the game loads, then 눌러서 시작. */
  .splash {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 9vh, 90px);
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    background: radial-gradient(circle at 50% 40%, #ffffff 0%, #e9ecff 40%, #c9d1fa 100%);
    transition: opacity 0.45s ease;
  }
  .splash.gone { opacity: 0; pointer-events: none; }
  .splash[hidden] { display: none; }
  .splash-logo { display: flex; flex-direction: column; align-items: center; }
  .splash-cube { width: min(46vw, 210px, 30vh); aspect-ratio: 344 / 392; filter: drop-shadow(0 16px 20px #3d4bd04d); animation: bob 2.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .splash-name { width: min(82vw, 380px, 70vh); margin-top: clamp(10px, 3vh, 22px); filter: drop-shadow(0 4px 0 #2f39a8); }
  .wordmark { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 900; }
  .splash-sub { margin: 8px 0 0; font-size: 15px; font-weight: 700; letter-spacing: 3px; color: #5a64c4; }
  .splash-foot { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 66px; }
  .loading { width: min(66vw, 280px); text-align: center; }
  .loading[hidden], .start[hidden] { display: none; }
  .loading-bar { height: 12px; border-radius: 6px; background: #ffffffb3; box-shadow: inset 0 0 0 1.5px #5b6cff33; overflow: hidden; }
  .loading-bar i { display: block; width: 0; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #8b97ff, #4654e0); }
  .loading span { display: block; margin-top: 9px; font-size: 13px; color: var(--muted); }
  .start {
    padding: 15px 42px;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(180deg, #7b88ff, #4654e0);
    border: 0;
    border-radius: 999px;
    box-shadow: 0 6px 0 #2f39a8, 0 12px 26px #3d4bd055;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  /* The home screen: the worlds in groups by difficulty, each with its flag. */
  .home {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    background: radial-gradient(120% 70% at 50% 0%, #ffffff 0%, var(--bg1) 45%, var(--bg2) 100%);
  }
  .home[hidden] { display: none; }
  .home-head { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 760px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px 4px; }
  .home-brand { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .home-cube { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 3px 4px #3d4bd033); }
  .home-brand b { font-size: 21px; color: #3f4bd6; white-space: nowrap; }
  .home-stars { padding: 7px 12px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .home-body { flex: 1; overflow: auto; padding: 0 16px max(24px, env(safe-area-inset-bottom)); overscroll-behavior: contain; }
  .home-body > * { max-width: 728px; margin-left: auto; margin-right: auto; }
  .continue { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 12px; padding: 12px 16px; text-align: left; border: 0; color: #fff; background: linear-gradient(180deg, #7b88ff, #4654e0); box-shadow: 0 4px 0 #2f39a8; }
  .continue[hidden] { display: none; }
  .continue .flag { width: 36px; box-shadow: 0 0 0 1.5px #ffffff88; }
  .continue-text { flex: 1; min-width: 0; }
  .continue b { display: block; font-size: 16px; }
  .continue small { display: block; font-size: 12px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 24px auto 10px; padding: 0 2px; }
  .group-head b { font-size: 18px; color: var(--ink); }
  .group-head .stars { margin-left: 6px; font-size: 14px; }
  .group-head span.note { font-size: 12px; color: var(--muted); text-align: right; }

  /* The stage menu: a sheet with one world's stages, over the game or the home screen. */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: #1f2a4d66;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .overlay[hidden] { display: none; }
  .sheet {
    width: min(560px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: #f6f7fe;
    border-radius: 22px;
    box-shadow: 0 18px 50px #1f2a4d40;
    overflow: hidden;
  }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; background: #fff; border-bottom: 1px solid var(--line); }
  .sheet-title { flex: 1; min-width: 0; }
  .sheet-title b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-title span { font-size: 12px; color: var(--muted); }
  .icon { width: 40px; height: 40px; padding: 0; font-size: 18px; flex: none; }
  .icon[hidden] { display: none; }
  .sheet-body { overflow: auto; padding: 14px 14px 20px; overscroll-behavior: contain; }
  .stars { color: #e3a21a; letter-spacing: 1px; }
  .world-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 10px; }
  .world-card {
    display: grid;
    grid-template-columns: 46px 1fr;
    align-items: center;
    column-gap: 10px;
    width: 100%;
    text-align: left;
    padding: 12px 12px 10px;
    border-radius: 16px;
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 2px 8px #2a3a8010;
  }
  .world-card .flag { width: 46px; }
  .world-card.current { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .world-card.locked { opacity: 0.6; }
  .wc-main { min-width: 0; }
  .wc-name { display: block; font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wc-gimmick { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wc-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 7px; margin-top: 10px; }
  .wc-foot .stars { flex: none; font-size: 11px; letter-spacing: 0; }
  .wc-bar { flex: 1; display: block; height: 5px; border-radius: 3px; background: #e8ebf8; overflow: hidden; }
  .wc-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .wc-count { flex: none; font-size: 11px; color: var(--muted); }
  .sheet-head .flag { width: 36px; }
  .about { font-size: 13px; color: var(--muted); margin: 0 2px 14px; line-height: 1.5; }
  .tutorial-btn { display: block; width: 100%; margin: 0 0 12px; font-size: 15px; font-weight: 700; background: #fff; }
  .tutorial-btn.done { background: var(--accent); color: #fff; border-color: transparent; }
  .tutorial-btn.current { outline: 3px solid var(--ink); outline-offset: 2px; }
  .stage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
  .stage {
    position: relative;
    aspect-ratio: 1;
    padding: 0;
    font-size: 15px;
    font-weight: 700;
    border-radius: 12px;
    background: #fff;
  }
  .stage.cleared { background: var(--accent); color: #fff; border-color: transparent; }
  .stage.current { outline: 3px solid var(--ink); outline-offset: 2px; }
  .stage .mark { position: absolute; top: -7px; right: -5px; font-size: 13px; color: #e3a21a; text-shadow: 0 0 2px #fff, 0 0 2px #fff; }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
</script>
</head>
<body>
  <div id="scenery" aria-hidden="true"></div>
  <div id="stage"></div>

  <!-- The cube of the app icon (icons/icon.svg), for the loading and home screens. -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="cubeLogo" viewBox="84 72 344 392">
      <g stroke="#4654e0" stroke-width="8" stroke-linejoin="round">
        <path d="M256 92 L408 180 L256 268 L104 180 Z" fill="#ffffff"/>
        <path d="M104 180 L256 268 L256 444 L104 356 Z" fill="#e3e8ff"/>
        <path d="M256 268 L408 180 L408 356 L256 444 Z" fill="#c9d1fb"/>
      </g>
      <g fill="none" stroke="#1f2a4d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <g transform="matrix(1.52 0.88 0 1.76 104 180)"><path d="M26 84 V30"/><path d="M70 80 V56 H50"/></g>
        <g transform="matrix(1.52 -0.88 0 1.76 256 268)"><path d="M24 22 V66 H62"/></g>
        <g transform="matrix(1.52 -0.88 1.52 0.88 104 180)"><path d="M26 70 H58 V36"/></g>
      </g>
      <g fill="#1f2a4d">
        <g transform="matrix(1.52 0.88 0 1.76 104 180)"><path d="M26 14 L15 32 H37 Z"/><path d="M36 56 L52 46 V66 Z"/></g>
        <g transform="matrix(1.52 -0.88 0 1.76 256 268)"><path d="M80 66 L62 55 V77 Z"/></g>
        <g transform="matrix(1.52 -0.88 1.52 0.88 104 180)"><path d="M58 18 L47 36 H69 Z"/></g>
      </g>
    </symbol>
  </svg>

  <div class="hud">
    <div class="hud-left">
      <button class="pill hud-home" id="homeBtn" title="홈 화면으로" aria-label="홈 화면으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5 12 4.2l8.5 7.3M6.4 9.6V20h11.2V9.6M10 20v-5.4h4V20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="pill title" id="worldBtn" title="스테이지 선택"><span class="flag" id="worldFlag"></span><span class="title-text"><b id="world">집 안</b><small id="stageLabel"></small></span></button>
    </div>
    <div class="hud-right">
      <div class="pill hearts" id="hearts" hidden></div>
      <div class="pill count">↑ <span id="remain">0</span></div>
    </div>
  </div>

  <div class="zoom">
    <button id="zoomIn" title="확대">＋</button>
    <button id="zoomOut" title="축소">－</button>
    <button id="resetView" title="시점 초기화">⟲</button>
    <button id="sound" title="효과음 끄기">🔊</button>
    <button id="beltL" title="벨트를 왼쪽으로 한 칸" hidden>◁</button>
    <button id="beltR" title="벨트를 오른쪽으로 한 칸" hidden>▷</button>
  </div>

  <div class="panel pill" id="panel" hidden>
    <h3>퍼즐 생성기</h3>
    <div class="row">
      <label>기믹</label>
      <select id="gimmick">
        <option value="">없음</option>
      </select>
    </div>
    <div class="row"><label>기믹 양 <output id="o_amount"></output></label><input type="range" id="amount" min="0" max="100"></div>
    <div class="row"><label>격자 크기 (한 면 N×N) <output id="o_N"></output></label><input type="range" id="N" min="3" max="16"></div>
    <div class="row"><label>화살표 최소 길이 <output id="o_minLen"></output></label><input type="range" id="minLen" min="2" max="10"></div>
    <div class="row"><label>화살표 최대 길이 <output id="o_maxLen"></output></label><input type="range" id="maxLen" min="2" max="40"></div>
    <div class="row"><label>직진 확률 (낮을수록 많이 꺾임) <output id="o_straight"></output></label><input type="range" id="straight" min="0" max="100"></div>
    <div class="row"><label>채움 목표 <output id="o_fill"></output></label><input type="range" id="fill" min="30" max="100"></div>
    <div class="row"><label>막기 강도 (높을수록 서로 길을 막음) <output id="o_block"></output></label><input type="range" id="block" min="0" max="100"></div>
    <div class="row"><label>의존 깊이 (높을수록 여러 면에 걸쳐 길게 기다림) <output id="o_deep"></output></label><input type="range" id="deep" min="0" max="100"></div>
    <div class="row"><label>면 걸침 (높을수록 모서리를 많이 넘음) <output id="o_wrap"></output></label><input type="range" id="wrap" min="0" max="100"></div>
    <div class="row"><label>긴 화살표 선호 (높을수록 짧은 화살표가 적음) <output id="o_long"></output></label><input type="range" id="long" min="0" max="100"></div>
    <div class="row seed"><label>시드</label><input type="number" id="seed" min="1"><button id="dice" title="무작위 시드">🎲</button></div>
    <label class="check"><input type="checkbox" id="showFree"> 지금 뺄 수 있는 화살표 표시</label>
    <button class="primary" id="gen">이 설정으로 생성</button>
    <p class="stats" id="stats"></p>
  </div>

  <div class="bar">
    <button id="prev">◀</button>
    <button id="retry">다시</button>
    <button id="next">▶</button>
    <button id="solve">자동 풀이</button>
    <button id="panelToggle">⚙ 생성기</button>
  </div>

  <div class="guide pill" id="guide" role="status" hidden>
    <div class="guide-head"><b id="guideStep"></b><button id="guideSkip">건너뛰기</button></div>
    <p id="guideText"></p>
    <button class="primary" id="guideNext" hidden>다음</button>
  </div>

  <div class="clear" id="clear" hidden>
    <div class="card">
      <h2 id="clearTitle">스테이지 클리어!</h2>
      <p class="clear-stars" id="clearStars"></p>
      <button class="primary" id="clearNext">다음 스테이지</button>
    </div>
  </div>

  <div class="overlay" id="menu" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <header class="sheet-head">
        <button class="icon" id="menuBack" aria-label="홈 화면으로">‹</button>
        <span class="flag" id="menuFlag"></span>
        <div class="sheet-title"><b id="menuTitle">월드</b><span id="menuSub"></span></div>
        <button class="icon" id="menuClose" aria-label="닫기">✕</button>
      </header>
      <div class="sheet-body" id="menuBody"></div>
    </section>
  </div>

  <div class="home" id="home" hidden>
    <header class="home-head">
      <div class="home-brand"><svg class="home-cube" aria-hidden="true"><use href="#cubeLogo"/></svg><b class="wordmark">Arrow Cube</b></div>
      <div class="pill home-stars" id="homeStars"></div>
      <button class="pill icon" id="homeSound" title="효과음 끄기">🔊</button>
    </header>
    <div class="home-body" id="homeBody"></div>
  </div>

  <div class="splash" id="splash">
    <div class="splash-logo">
      <svg class="splash-cube" aria-hidden="true"><use href="#cubeLogo"/></svg>
      <svg class="splash-name" viewBox="0 0 400 92" role="img" aria-label="Arrow Cube">
        <defs>
          <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8794ff"/>
            <stop offset="1" stop-color="#3f4bd6"/>
          </linearGradient>
        </defs>
        <text class="wordmark" x="200" y="68" text-anchor="middle" textLength="372" lengthAdjust="spacingAndGlyphs" font-size="68" fill="url(#nameFill)" stroke="#fff" stroke-width="12" stroke-linejoin="round" paint-order="stroke">Arrow Cube</text>
      </svg>
      <p class="splash-sub">3D 화살표 퍼즐</p>
    </div>
    <div class="splash-foot">
      <div class="loading" id="loading"><div class="loading-bar"><i id="loadBar"></i></div><span id="loadText">불러오는 중 0%</span></div>
      <button class="start" id="start" hidden>눌러서 시작</button>
    </div>
  </div>
  <script>
    // The loading bar creeps towards 90% while the game loads; once game.js calls
    // splash.ready() (and the logo has had 1.2 s) it fills up and 눌러서 시작 shows.
    window.splash = (() => {
      const t0 = performance.now();
      let last = t0;
      let ready = false;
      let p = 0;
      const step = (now) => {
        const t = (now - t0) / 1000;
        const dt = Math.min(0.25, (now - last) / 1000);
        last = now;
        if (ready && t > 1.2) p = Math.min(100, p + 60 * dt);
        else p += (90 * (1 - Math.exp(-2 * t)) - p) * Math.min(1, 6 * dt);
        document.getElementById('loadBar').style.width = `${p}%`;
        document.getElementById('loadText').textContent = `불러오는 중 ${Math.floor(p)}%`;
        if (p < 100) return requestAnimationFrame(step);
        document.getElementById('loading').hidden = true;
        document.getElementById('start').hidden = false;
      };
      requestAnimationFrame(step);
      return { ready: () => (ready = true) };
    })();
  </script>

  <script type="module" src="src/game.js"></script>
</body>
</html>
